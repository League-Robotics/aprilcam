[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aprilcam"
version = "0.20260822.9"
description = "MCP server and CLI for camera management, AprilTag/ArUco detection, playfield homography, and image processing"
authors = [
  { name = "Eric Busboom" }
]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["opencv", "apriltag", "aruco", "camera", "computer-vision", "mcp", "robotics", "homography", "fiducial"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Base dependencies: lightweight gRPC client stack + MCP server framework.
# The MCP server, web hub, and view client are opencv-free thin clients that
# ship in the base install, so the MCP SDK belongs here (not the daemon extra).
# Heavy server/vision deps go in the optional extras below.
dependencies = [
  "grpcio>=1.60",
  "protobuf>=4.25",
  "pydantic>=2.0",
  "numpy>=1.23",
  "python-dotenv>=1.0",
  "rich>=13.0",
  "zeroconf>=0.131",
  "pillow>=10.0",
  "mcp>=1.0",
  "opencv-contrib-python>=4.8",
]

[project.urls]
Repository = "https://github.com/Busboombot/aprilcam"

[project.scripts]
aprilcam = "aprilcam.cli:main"

[project.optional-dependencies]
imaging = []
daemon = [
  "mss>=9.0",
  "websockets>=12.0",
  "fpdf2>=2.7",
  "cv2-enumerate-cameras>=1.3",
  "msgpack>=1.0",
  "grpcio-reflection>=1.60",
]
dev = [
  "ipykernel>=7.2.0",
  "ipython>=8.39.0",
  "jupyter>=1.1.1",
  "anthropic>=0.104.0",
  "grpcio-tools>=1.60",
]
playfield = ["pygame>=2.5"]

[tool.uv]
# uv works with standard pyproject; this section is optional and can hold uv-specific settings later.

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["archive*"]

[tool.setuptools.package-data]
aprilcam = ["AGENT_GUIDE.md", "ROBOT_API_GUIDE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["archive", ".git", ".clasi", "build", "dist"]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end tests that start real daemon/hardware processes (deselect with -m 'not integration')",
    "camera: tests that require real capture hardware attached (deselect with -m 'not camera')",
]

[dependency-groups]
dev = [
    "anthropic>=0.104.0",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "mypy>=1.13",
    "nbconvert>=7.17.1",
    "pandas>=2.3.3",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24",
    "types-PyYAML>=6.0",
]

# Pragmatic strictness: catches real bugs (unreachable code, bad
# Optional handling, mismatched returns, wrong argument types) without
# demanding full annotation coverage or `--strict`'s wall of noise on
# code that talks to unstubbed third-party libraries (cv2, grpc, the
# generated protobuf modules). `tests/test_typing.py` shells out to
# this and is what `uv run pytest` exercises; run `uv run mypy`
# directly for the same check on its own.
[tool.mypy]
python_version = "3.10"
files = ["src/aprilcam"]
exclude = ["^archive/", "^src/aprilcam/proto/"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true

# Third-party libraries that ship no type stubs and have none available
# on PyPI for this project's pin. Targeted per-module, not a blanket
# `ignore_missing_imports` — a real stub landing for any one of these
# should start being checked again without anyone having to notice and
# remove a global switch. Add an entry here only once a module is
# actually imported from `src/aprilcam` — `mypy --warn-unused-configs`
# flags an override for a module nothing imports yet.
[[tool.mypy.overrides]]
module = ["cv2.*", "cv2_enumerate_cameras.*", "grpc.*"]
ignore_missing_imports = true

# Generated gRPC/protobuf code (`aprilcam/proto/*_pb2*.py`): dynamically
# built at import time via protobuf's reflection machinery, so its
# module-level names are invisible to static analysis regardless of
# stubs. Excluded from direct checking above; here it is additionally
# treated as `Any` wherever the rest of the tree imports it (the proto
# boundary in `client/models.py` / `daemon/rpc.py` / `client/
# daemon_client.py` is exactly the chokepoint meant to absorb this).
[[tool.mypy.overrides]]
module = ["aprilcam.proto.*"]
follow_imports = "skip"
