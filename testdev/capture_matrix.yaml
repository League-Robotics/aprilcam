# testdev/capture_matrix.yaml
#
# Variation matrix for testdev/capture_matrix.py (see
# docs/test-plans/camera-image-matrix.md §3/§4).
#
# `cameras` is a list of entries keyed by a case-insensitive substring
# `match` against the camera's daemon-known SLUG (Daemon.list_cameras()'s
# CameraState.name -- e.g. "arducam-ov9281-usb-camera" -- not a live-
# enumerated OS device name; sprint 035 ticket 004 moved this tool onto the
# daemon's own camera addressing). The first matching entry wins. When no
# entry matches, `fallback` applies: it builds an exposure/gain/white-
# balance sweep from fixed [minimum, maximum] ranges (below) rather than a
# live hardware query -- see capture_matrix.py's module docstring, "No live
# range query for the generic fallback sweep".
#
# Every `controls:` map is keyed by CameraConfig.settings' own five-key
# abstracted vocabulary (camera/backends/uvc_util.py's `_CONTROLS`) -- the
# only vocabulary Daemon.set_camera_config accepts: `exposure`, `gain`,
# `auto_exposure` (UVC auto-exposure-mode bitmap: 1=manual, 8=aperture-
# priority), `white_balance_temperature`, `auto_white_balance` (boolean).
# Ported from the pre-035-004 raw-uvc-util-control-name spelling
# (`exposure-time-abs`, `auto-exposure-mode`, `white-balance-temp`,
# `auto-white-balance-temp`) -- values are numerically unchanged, only the
# key spelling and (for auto_white_balance) the true/false representation
# moved from quoted "true"/"false" strings to YAML booleans.
#
# Every camera always gets a `baseline.jpg` (baseline settings, unmodified)
# in addition to the variations/fallback-sweep entries below. Each
# variation's `controls` are OVERLAID onto the camera's own baseline
# settings (never a hardcoded baseline, always the camera's live config as
# fetched from the daemon) and pushed as ONE whole document per variation
# -- see capture_matrix.py's "Whole-document push" section.

settle_s: 1.5          # default settle time before capture, per variation
settle_s_auto: 3.0      # settle time for variations that touch an "auto" control

cameras:
  # Arducam OV9782 (main-playfield tag camera). Baseline (from config.json):
  # auto_exposure=1 (manual), exposure=6, gain=2, white_balance_temperature=
  # 4600, auto_white_balance=false. Known washout cliff around exposure
  # 12-18 (docs/knowledge) — deliberately crossed.
  - match: "ov9782"
    variations:
      # -- exposure sweep at baseline gain --
      - name: exp-03
        controls: {exposure: 3}
      - name: exp-04
        controls: {exposure: 4}
      - name: exp-08
        controls: {exposure: 8}
      - name: exp-10
        controls: {exposure: 10}
      - name: exp-12
        controls: {exposure: 12}
      - name: exp-16
        controls: {exposure: 16}
      - name: exp-24
        controls: {exposure: 24}
      - name: exp-40
        controls: {exposure: 40}
      # -- gain sweep at baseline exposure --
      - name: gain-01
        controls: {gain: 1}
      - name: gain-04
        controls: {gain: 4}
      - name: gain-08
        controls: {gain: 8}
      - name: gain-16
        controls: {gain: 16}
      # -- auto-exposure toggle (baseline is manual mode 1) --
      - name: auto-exposure
        controls: {auto_exposure: 8}
        settle_s: 3.0
      # -- white balance --
      - name: wb-3000
        controls: {white_balance_temperature: 3000}
      - name: wb-6500
        controls: {white_balance_temperature: 6500}
      - name: wb-auto
        controls: {auto_white_balance: true}
        settle_s: 3.0
      # -- combined stress states (realistic drift) --
      - name: stress-lowexp-higain
        controls: {exposure: 3, gain: 16}
      - name: stress-highexp-logain
        controls: {exposure: 40, gain: 1}

  # Arducam OV9281 (camera 5, monochrome global-shutter, main-playfield).
  # Ambient-dependent exposure -- NOT a single fixed camera default like
  # OV9782's -- see docs/knowledge/dark-camera-image-uvc-drift-reset.md's
  # daylight sweep: exposure ~20 in daylight is the known-good daytime
  # value (75-300 saturates in daylight, 0/5 AprilTags; 10 starts dropping
  # ArUco), ~300 known-good at night (manual exposure by design -- the
  # daemon never auto-adjusts). That "baseline exposure 20" is
  # informational only, describing this camera's expected live state --
  # like every camera in this file, the actual capture-time baseline is
  # always this camera's live config as fetched from the daemon (never
  # this entry, never hardcoded), so the sweep below does not special-case
  # 20 as "the" baseline value the way OV9782's entry skips its own
  # baseline exposure (6). The sweep spans 5-300 to cover both day and
  # night operating ranges in one committed fixture generation. No
  # white-balance axis: OV9281 is a monochrome sensor, no color-
  # temperature control exists on this hardware.
  - match: "ov9281"
    variations:
      # -- exposure sweep spanning day (low) through night (high) --
      - name: exp-005
        controls: {exposure: 5}
      - name: exp-010
        controls: {exposure: 10}
      - name: exp-015
        controls: {exposure: 15}
      - name: exp-020
        controls: {exposure: 20}
      - name: exp-030
        controls: {exposure: 30}
      - name: exp-050
        controls: {exposure: 50}
      - name: exp-075
        controls: {exposure: 75}
      - name: exp-100
        controls: {exposure: 100}
      - name: exp-150
        controls: {exposure: 150}
      - name: exp-200
        controls: {exposure: 200}
      - name: exp-300
        controls: {exposure: 300}
      # -- gain axis at baseline exposure -- values mirror OV9782's own
      # gain sweep (same Arducam OV92xx sensor family); unconfirmed
      # against this specific camera's supported range, so any value the
      # daemon rejects is recorded (not silently dropped) in the
      # manifest's skipped_variations.apply_failed rather than failing
      # the whole run -- see run_camera's per-variation push.
      - name: gain-01
        controls: {gain: 1}
      - name: gain-04
        controls: {gain: 4}
      - name: gain-08
        controls: {gain: 8}
      - name: gain-16
        controls: {gain: 16}

# Generic fallback for any camera with no matching `cameras` entry above
# (e.g. HD USB CAMERA, which has no `settings` block in its config.json).
# Baseline is whatever the camera's live daemon config is when the tool
# starts -- it is snapshotted and restored, never assumed. Sweep values are
# computed from the FIXED ranges below (*_range: [minimum, maximum]) rather
# than a live uvc-util query -- capture_matrix.py's module docstring, "No
# live range query for the generic fallback sweep", explains why: the
# daemon has no RPC exposing hardware control ranges, and re-adding a
# direct uvc-util shell here for range-only queries would need the OS
# device name back, which the daemon's camera addressing (slug/number)
# deliberately does not expose. These ranges are not invented -- they are
# the same fixed ranges camera/backends/uvc_util.py's own module docstring
# already documents and relies on for every macOS camera's control surface
# ("Control names and ranges": exposure-time-abs 1..5000 in 100µs ticks,
# white-balance-temp 2800..6500 Kelvin default 4600, gain 0..100 default 0).
fallback:
  exposure_control: exposure
  exposure_range: [1, 5000]
  exposure_fractions: [0.005, 0.01, 0.03, 0.08, 0.2, 0.5, 1.0]
  gain_control: gain
  gain_range: [0, 100]
  gain_fractions: [0.05, 0.15, 0.3, 0.5, 0.8, 1.0]
  auto_exposure_control: auto_exposure
  # UVC-spec auto-exposure-mode values: 1=manual, 2=auto, 4=shutter-priority,
  # 8=aperture-priority. Try whichever of these differs from the live
  # baseline, once, so the sweep documents whether auto mode changes
  # detection quality without assuming which mode is "the" auto mode.
  auto_exposure_candidate_values: [1, 8]
  auto_exposure_settle_s: 3.0
  white_balance_control: white_balance_temperature
  white_balance_range: [2800, 6500]
  white_balance_fractions: [0.0, 0.5, 1.0]
  auto_white_balance_control: auto_white_balance
  auto_white_balance_settle_s: 3.0
  stress_combos:
    - name: stress-lowexp-higain
      exposure_fraction: 0.01
      gain_fraction: 1.0
    - name: stress-highexp-logain
      exposure_fraction: 1.0
      gain_fraction: 0.05
