name: aprilcam
title: AprilCam v2
blurb: Rebuilt MCP server and gRPC daemon for AprilTag/ArUco perception on robotics playfields — one daemon owns the cameras and all vision; agents and robot control loops read tag positions, orientation, velocity, and homography through thin clients.
