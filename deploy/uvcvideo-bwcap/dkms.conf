PACKAGE_NAME="uvcvideo-bwcap"
PACKAGE_VERSION="1.0"
# Stock uvcvideo (upstream source for the running kernel) plus a max_payload module parameter that
# caps the isochronous bandwidth a camera may request, so the three playfield
# cameras can share one USB 2.0 hub. See aprilcam docs/knowledge.
BUILT_MODULE_NAME[0]="uvcvideo"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build CONFIG_USB_VIDEO_CLASS=m modules"
AUTOINSTALL="yes"
