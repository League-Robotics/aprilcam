# Autoload v4l2loopback at boot, before any bridge or daemon unit starts
# (sprint 040 ticket 001). Reproduces vidar.local's already-working
# /etc/modules-load.d/aprilcam.conf exactly. Its options come from the
# matching deploy/modprobe.d/aprilcam.conf -- both files must be installed
# together; loading this module with no matching modprobe.d options file
# falls back to v4l2loopback's own defaults (video_nr unset, no
# aprilcam-* card labels, and too few buffers -- see modprobe.d/
# aprilcam.conf's max_buffers comment).
#
# Install: sudo cp deploy/modules-load.d/aprilcam.conf /etc/modules-load.d/aprilcam.conf
#
# Note: v4l2loopback is a DKMS module. If it silently vanishes after a
# kernel upgrade (missing kernel headers stop DKMS from rebuilding it),
# see archive/docs/knowledge/v4l2loopback-vanishes-after-kernel-upgrade.md
# -- ported to docs/knowledge/raspberry-pi-camera-setup.md by ticket 005.
v4l2loopback
