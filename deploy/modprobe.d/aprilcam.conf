# v4l2loopback module options for AprilCam's CSI camera bridge
# (sprint 040 ticket 001). Reproduces vidar.local's already-working
# /etc/modprobe.d/aprilcam.conf exactly (confirmed byte-for-byte via SSH
# while writing this ticket) so a fresh Pi provisioned from this file
# reaches vidar's current, proven state.
#
# Install: sudo cp deploy/modprobe.d/aprilcam.conf /etc/modprobe.d/aprilcam.conf
#
# video_nr=70,71 -- fixed loopback device numbers /dev/video70, /dev/video71.
# card_label=... -- the /sys/class/video4linux/videoN/name each device
#   reports; must start with the "aprilcam-" prefix
#   camera/backends/libcamera.py's list_loopback_cameras() scans for
#   (default prefix, no APRILCAM_LIBCAM_LOOPBACK_LABEL override needed).
# exclusive_caps=1,1 -- required for a v4l2loopback device to work as both
#   a GStreamer v4l2sink (bridge, writer) and a v4l2-ctl streaming-mmap
#   reader (daemon) at once.
# max_buffers=16 -- MUST be generous. With the default (3) buffers, the
#   daemon's v4l2-ctl streaming-mmap reader starves to ~0.2-0.6 fps even
#   though the bridge's libcamerasrc->v4l2sink writer happily pushes
#   15-30 fps (archive/docs/knowledge/v4l2loopback-vanishes-after-kernel-
#   upgrade.md's "reference config that must line up"; isolated by
#   measuring each pipeline stage independently on vidar). 16 buffers
#   restores full fps.
options v4l2loopback video_nr=70,71 card_label=aprilcam-imx296-88000,aprilcam-imx296-80000 exclusive_caps=1,1 max_buffers=16
