# uvcvideo bandwidth cap for a Linux daemon host with several USB (UVC)
# cameras on one USB 2.0 hub (buzzkill). Needs the patched uvcvideo from
# deploy/uvcvideo-bwcap/. The stock driver has no max_payload parameter;
# it loads anyway and logs "unknown parameter 'max_payload' ignored", so
# this file is harmless on a host without the patch (but does nothing).
#
# Install: deploy/provision-uvc-host.sh (or copy to /etc/modprobe.d/).
#
# max_payload=1600 -- every camera asks for its largest isochronous
#   altsetting in MJPG (3x1024 B per microframe) whatever the mode; three
#   of them oversubscribe one high-speed link and only the first streams.
#   The driver picks the smallest altsetting AT OR ABOVE the cap, so 1600
#   gives the Arducams alt 4 (2x800) and the HD camera alt 8 (2x800),
#   ~4800 B total. 1984 is too high (rounds up to 2400 on the Arducams).
#   See docs/knowledge/2026-10-31-linux-uvc-daemon-host-buzzkill.md.
options uvcvideo max_payload=1600
