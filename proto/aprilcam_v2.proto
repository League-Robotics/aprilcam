// aprilcam_v2.proto -- the v2 daemon control plane, growing in place.
//
// **This file is a subset, not a placeholder.** Sprint 020 (daemon
// bring-up) needed exactly four RPCs -- ListCameras, ProbeCameras,
// GetFrame, GetStatus -- to satisfy UC-01, UC-13 (local-lifecycle
// parts), UC-14, UC-17, and UC-25's in-scope scenarios. The full v1
// surface (`archive/proto/aprilcam.proto`, 369 lines: calibration,
// annotations, config push/pull, mobile tags, stream endpoints) was
// deliberately not converted then -- see sprint 020's architecture
// Decision 1. Sprint 021 is the first EXTENSION of this same file in
// place -- GetTags/GetTag/GetTagHistory and their messages added
// alongside sprint 020's four, existing ones only ever widened (new
// optional fields, e.g. GetFrameResponse.tags below), never removed
// or renumbered -- exactly the growth path this file's evolution rule
// anticipated, not a replacement. Treat every message/field number
// below as permanent.
//
// Sprint 022 ticket 001 is the second such extension: SetPlayfield /
// GetPlayfield / ListPlayfields / SetCameraConfig / GetCameraConfig,
// the minimal config-service slice sprint.md's Architecture Decision 1
// scopes for this sprint (playfields in full; camera config carrying
// only the playfield link -- hardware-settings push is sprint 023).
// `PlayfieldDefinition`/`PlayfieldFeatureEntry` mirror
// `aprilcam.config.loader.PlayfieldDefinition`'s actual stored shape
// (per-section entries with an id where one exists), not the more
// abstract `aprilcam.config.interfaces.Feature`/`required_aruco_ids()`
// view -- `Feature` deliberately carries no numeric id, and calibration
// (ticket 003) needs exactly that id -> position mapping to survive a
// push/fetch round trip, so the wire shape mirrors the concrete
// implementation instead of dropping it. `CameraConfig.settings`
// (`dict[str, Any]` in Python) crosses the wire as a JSON-encoded
// string rather than `google.protobuf.Struct`, avoiding a well-known-type
// import for a value this sprint only ever stores and echoes back,
// never applies (Decision 1).
//
// Ticket 003 is the third: `Calibrate` / `GetCalibration`. Every vision
// call happens inside the daemon (UC-04 main flow step 1: "the client
// sends a command, not pixels") -- `CalibrateRequest` carries only a
// camera name, never a frame. `CalibrationResult` mirrors
// `aprilcam.calibration.interfaces.CalibrationResult` field for field
// -- `missing_ids` is always the exact ids, never a count (UC-04.S-2).
// `Calibration` mirrors `aprilcam.calibration.calibration.Calibration`:
// the homography crosses as 9 `double`s (row-major) rather than a
// nested-message matrix type, since nothing else in this file needs a
// generic NxM matrix shape.
//
// Wire conventions this file follows (docs/design/design.md §6):
//   - World-cm coordinates cross this boundary only inside `TagRecord`
//     (`world`, `world_velocity`, `world_corners`), and every camera
//     this sprint is uncalibrated, so those fields are always absent
//     on the wire this sprint -- never a `0.0`/`(0,0)` placeholder.
//   - `optional` scalar fields distinguish "not applicable" from a
//     legitimate zero/empty value (`CameraState.playfield`,
//     `CameraState.number`, `TagRecord.heading_rad`, ...) -- the same
//     Optional-vs-None-vs-empty discipline `types.py` enforces in
//     Python.
//
// Deliberately absent this sprint (Stage 8 territory, not forgotten):
// OpenCamera/CloseCamera (no explicit open/close verb -- `GetFrame`
// opens on demand and the daemon holds it, see `daemon/service.py`),
// calibration trigger, config push/pull, annotation store, mobile-tag
// registry, stream endpoint allocation (`GetImageStream`/
// `GetTagStream`), `WhereIs`. None of this sprint's use cases need
// them.

syntax = "proto3";

package aprilcam.v2;

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------

service AprilCamV2 {
  // Every camera the registry knows, present or not (daemon.interfaces.
  // Daemon.list_cameras). Cheap -- answered from what the daemon already
  // knows, never re-probes.
  rpc ListCameras (ListCamerasRequest) returns (ListCamerasResponse);

  // Force a deep re-interrogation of every backend (UC-25). May be slow;
  // never disturbs a camera already held open for a live caller -- such
  // a camera is reported from cached state and named in `skipped`.
  rpc ProbeCameras (ProbeCamerasRequest) returns (ProbeCamerasResponse);

  // One raw frame from a named camera (UC-17). `deskewed=true` on an
  // uncalibrated camera (every camera, this sprint -- no calibration
  // subsystem exists yet) fails explicitly rather than substituting a
  // raw frame.
  rpc GetFrame (GetFrameRequest) returns (GetFrameResponse);

  // Readiness, queryable by any client (UC-05, as scoped by this
  // sprint's four-RPC surface).
  rpc GetStatus (GetStatusRequest) returns (GetStatusResponse);

  // Every tag currently detected on a named camera (UC-10). Triggers
  // exactly one demand-driven detection burst per call
  // (`daemon/detection.py`) and appends it to that camera's ring
  // buffer; an idle field returns an empty `TagFrame`, never an error.
  rpc GetTags (GetTagsRequest) returns (GetTagsResponse);

  // One tag, by family and id (UC-09). Runs the same single burst
  // `GetTags` would (so the "exactly one burst per call" budget is
  // shared, not doubled) and filters it for the requested tag.
  // Absent `GetTagResponse.record` (`HasField("record") == false`,
  // never a zero-valued `TagRecord`) means the tag was not detected
  // this burst.
  rpc GetTag (GetTagRequest) returns (GetTagResponse);

  // Recent per-frame history from a camera's ring buffer (UC-26). A
  // pure buffer read -- triggers no new detection burst. A buffer with
  // fewer entries than requested returns everything available, not an
  // error. A frame where the (optionally) requested tag was absent is
  // an explicit entry with an empty `TagFrame.tags` -- gaps are never
  // interpolated or silently dropped (UC-26.S-4).
  rpc GetTagHistory (GetTagHistoryRequest) returns (GetTagHistoryResponse);

  // Adopt a playfield definition, in memory, keyed by its own `name`
  // (UC-02). Rejected whole if malformed -- client-side validation
  // (`config/loader.py`'s `ConfigLoader`) means a malformed document
  // never reaches this RPC in practice (UC-23.S-4).
  rpc SetPlayfield (SetPlayfieldRequest) returns (SetPlayfieldResponse);

  // Fetch one playfield by name, plus its derived `linked_cameras`
  // (UC-02). Unknown name -> NOT_FOUND, naming the playfields held.
  rpc GetPlayfield (GetPlayfieldRequest) returns (GetPlayfieldResponse);

  // Every playfield this daemon currently holds (Decision 4: no
  // single-slot limit).
  rpc ListPlayfields (ListPlayfieldsRequest) returns (ListPlayfieldsResponse);

  // Push a camera config, in memory, keyed by its own `name`. This
  // sprint's minimal slice (Decision 1): only `playfield` has any
  // observable effect (linking the camera); `settings` round-trips
  // through `GetCameraConfig` but is never applied to hardware.
  rpc SetCameraConfig (SetCameraConfigRequest) returns (SetCameraConfigResponse);

  // Fetch one camera's config as last pushed. A camera nobody has
  // configured yet is NOT_FOUND, not a fabricated blank document (the
  // introspected-plus-blank template is out of scope this sprint).
  rpc GetCameraConfig (GetCameraConfigRequest) returns (GetCameraConfigResponse);

  // Establish a camera's pixel<->world mapping against its linked
  // playfield (UC-04, UC-15). All vision happens in the daemon; the
  // client sends a camera name, not pixels. All-or-nothing against the
  // playfield definition's required ArUco set -- `CalibrationResult.
  // missing_ids` names exactly which ids were absent, never a count.
  // `NoPlayfieldLinked` (a camera with no playfield link) maps to
  // FAILED_PRECONDITION, distinct from an explicit-but-failed
  // `CalibrationResult` (UC-15.S-2).
  rpc Calibrate (CalibrateRequest) returns (CalibrateResponse);

  // Fetch a camera's currently-held calibration, if any (UC-01, UC-05).
  // Absent `GetCalibrationResponse.calibration`
  // (`HasField("calibration") == false`) means the camera has never
  // been successfully calibrated -- never a fabricated/default
  // `Calibration`, mirroring `GetTagResponse.record`'s presence
  // discipline.
  rpc GetCalibration (GetCalibrationRequest) returns (GetCalibrationResponse);
}

// ---------------------------------------------------------------------------
// Shared messages
// ---------------------------------------------------------------------------

// Mirrors aprilcam.types.CameraState field-for-field. See that
// dataclass's docstring for what each field means (UC-14, UC-25):
// `present=false` with a config still held is normal, not an error;
// `usable=false` with `present=true` is "plugged in and broken".
message CameraState {
  string name = 1;
  bool present = 2;
  bool usable = 3;
  optional string playfield = 4;
  bool calibrated = 5;
  bool calibration_stale = 6;
  bool frame_dark = 7;
  // Stable registry enumeration number (UC-14.S-1). Absent
  // (`HasField("number") == false`) only for a camera not yet
  // registered -- mirrors `CameraState.number`'s `Optional[int]`.
  optional int32 number = 8;
}

// One backend a probe could not interrogate, and why (UC-25.S-7).
// Mirrors aprilcam.types.ProbeSkip.
message ProbeSkip {
  string backend = 1;
  string reason = 2;
}

// A position in world cm, A1-centred, +x east +y north. Mirrors
// aprilcam.types.WorldPoint.
message WorldPoint {
  double x = 1;
  double y = 2;
}

// A position in an image, in pixels, origin top-left. Mirrors
// aprilcam.types.PixelPoint -- diagnostic/render-time only, per that
// class's docstring.
message PixelPoint {
  double x = 1;
  double y = 2;
}

// Which fiducial family a tag id belongs to. Mirrors
// aprilcam.types.TagFamily. The v1 `-(N+1)` internal ArUco encoding
// never appears on the wire -- `TagId.number` is always the family's
// own non-negative id (design.md §6's ID-space note describes the
// *storage* encoding, not this wire contract).
enum TagFamily {
  TAG_FAMILY_UNSPECIFIED = 0;
  APRILTAG = 1;
  ARUCO = 2;
}

// A tag's full identity: family plus number. Mirrors
// aprilcam.types.TagId field-for-field.
message TagId {
  TagFamily family = 1;
  int32 number = 2;
}

// One tag, as observed in one frame. Mirrors aprilcam.types.TagRecord
// field-for-field (UC-09, UC-10, UC-26) -- see that dataclass's
// docstring for the world-first contract and the boundary/hat corner
// convention. Every record this sprint is honestly uncalibrated:
// `world`, `heading_rad`, `world_velocity`, `speed`, `yaw_rad`, and
// `world_corners` are all absent (no calibration subsystem exists
// yet) -- absence must round-trip as absence, never as a `0.0`/empty
// placeholder that looks like a real answer. `pixel`/`pixel_corners`
// are the only populated geometry this sprint.
message TagRecord {
  TagId tag = 1;
  optional WorldPoint world = 2;
  optional double heading_rad = 3;
  optional WorldPoint world_velocity = 4;
  optional double speed = 5;
  double timestamp = 6;
  optional PixelPoint pixel = 7;
  bool calibrated = 8;
  optional double yaw_rad = 9;
  // Exactly 4 points (front-left, front-right, back-right, back-left)
  // when present -- a valid corner quad is never empty, so an empty
  // `repeated` here is the unambiguous "absent" encoding (unlike
  // `GetFrameResponse.tags` below, which needs true field presence
  // because an empty `TagFrame` is itself a valid answer).
  repeated WorldPoint world_corners = 10;
  repeated PixelPoint pixel_corners = 11;
}

// Every tag detected in a single frame, with when it was captured.
// Mirrors aprilcam.types.TagFrame field-for-field.
message TagFrame {
  repeated TagRecord tags = 1;
  double timestamp = 2;
  int32 frame_index = 3;
  bool calibration_stale = 4;
}

// ---------------------------------------------------------------------------
// ListCameras
// ---------------------------------------------------------------------------

message ListCamerasRequest {}

message ListCamerasResponse {
  repeated CameraState cameras = 1;
}

// ---------------------------------------------------------------------------
// ProbeCameras
// ---------------------------------------------------------------------------

message ProbeCamerasRequest {}

message ProbeCamerasResponse {
  repeated CameraState cameras = 1;
  // Empty means the probe was genuinely complete (UC-25.S-7) -- never
  // omit this field to mean "nothing to report".
  repeated ProbeSkip skipped = 2;
}

// ---------------------------------------------------------------------------
// GetFrame
// ---------------------------------------------------------------------------

message GetFrameRequest {
  string camera = 1;
  bool deskewed = 2;
  // "jpeg" (default -- an empty string means "unset, use the default")
  // or "png" (lossless, for test fixtures). See
  // daemon.interfaces.Daemon.get_frame.
  string encoding = 3;
}

message GetFrameResponse {
  bytes data = 1;
  int32 width = 2;
  int32 height = 3;
  // What was actually produced -- always echoes the request's resolved
  // encoding this sprint (no server-side fallback substitution).
  string encoding = 4;
  double timestamp = 5;
  bool deskewed = 6;
  bool calibration_stale = 7;
  bool frame_dark = 8;
  // The detection-burst result nearest this frame's capture
  // (`daemon/detection.py`), embedded so one fetched frame is
  // sufficient to render an annotated view -- boundaries and hats from
  // the records' corners, positions from world coordinates once
  // calibrated. Presence, not an empty-vs-absent default, carries
  // aprilcam.types.ImageFrame.tags's three-way distinction: absent
  // (`HasField("tags") == false`) means no detection has run for this
  // camera yet; a present-but-empty `TagFrame` means detection ran and
  // saw nothing. `get_frame` never triggers a detection burst itself
  // -- this is a read of whatever the ring buffer already holds.
  //
  // px_per_cm / world_extent / annotations from aprilcam.types.
  // ImageFrame are still NOT carried this sprint -- they are only
  // meaningful for deskewed/calibrated frames, none of which this
  // sprint's daemon slice produces (get_frame(deskewed=True) always
  // fails explicitly; no calibration subsystem exists yet). A later
  // stage adds them here, additively, when calibration lands.
  optional TagFrame tags = 9;
}

// ---------------------------------------------------------------------------
// GetStatus
// ---------------------------------------------------------------------------

message GetStatusRequest {}

message GetStatusResponse {
  bool running = 1;
  repeated CameraState cameras = 2;
  string config_dir = 3;
  string state_dir = 4;
}

// ---------------------------------------------------------------------------
// GetTags
// ---------------------------------------------------------------------------

message GetTagsRequest {
  string camera = 1;
}

message GetTagsResponse {
  TagFrame tags = 1;
}

// ---------------------------------------------------------------------------
// GetTag
// ---------------------------------------------------------------------------

message GetTagRequest {
  string camera = 1;
  TagId tag = 2;
}

message GetTagResponse {
  // Absent (`HasField("record") == false`) means the tag was not
  // detected this burst -- never a zero-valued TagRecord (UC-09.S-4).
  TagRecord record = 1;
}

// ---------------------------------------------------------------------------
// GetTagHistory
// ---------------------------------------------------------------------------

message GetTagHistoryRequest {
  string camera = 1;
  // Absent means "every tag" -- mirrors
  // Daemon.get_tag_history(tag: Optional[TagId] = None).
  optional TagId tag = 2;
  // Absent means "every buffered frame" -- mirrors
  // Daemon.get_tag_history(frames: Optional[int] = None).
  optional int32 frames = 3;
}

message GetTagHistoryResponse {
  repeated TagFrame history = 1;
}

// ---------------------------------------------------------------------------
// Playfields (ticket 022-001)
// ---------------------------------------------------------------------------

// One entry from a playfield definition's april_tags / aruco_tags /
// rectangles / dots array. Mirrors aprilcam.config.loader.
// PlayfieldFeatureEntry, not aprilcam.config.interfaces.Feature -- see
// this file's header comment for why. `id` is set for april_tags/
// aruco_tags entries only (calibration ground truth); `colour` for
// rectangles/dots entries only.
message PlayfieldFeatureEntry {
  string slug = 1;
  double x = 2;
  double y = 3;
  optional int32 id = 4;
  optional string colour = 5;
}

// A whole playfield definition document. Mirrors aprilcam.config.
// loader.PlayfieldDefinition field-for-field.
message PlayfieldDefinition {
  string name = 1;
  double width_cm = 2;
  double height_cm = 3;
  repeated PlayfieldFeatureEntry april_tags = 4;
  repeated PlayfieldFeatureEntry aruco_tags = 5;
  repeated PlayfieldFeatureEntry rectangles = 6;
  repeated PlayfieldFeatureEntry dots = 7;
}

// A playfield the daemon knows about, as served. Mirrors aprilcam.
// playfield.interfaces.Playfield: name + definition, plus
// linked_cameras derived at serve time -- never stored in the
// definition itself, so the two can never disagree.
message PlayfieldEntry {
  string name = 1;
  PlayfieldDefinition definition = 2;
  repeated string linked_cameras = 3;
}

message SetPlayfieldRequest {
  PlayfieldDefinition definition = 1;
}

message SetPlayfieldResponse {}

message GetPlayfieldRequest {
  string name = 1;
}

message GetPlayfieldResponse {
  PlayfieldEntry playfield = 1;
}

message ListPlayfieldsRequest {}

message ListPlayfieldsResponse {
  repeated PlayfieldEntry playfields = 1;
}

// ---------------------------------------------------------------------------
// Camera config -- minimal playfield-link slice (ticket 022-001,
// Decision 1). Mirrors aprilcam.config.interfaces.CameraConfig, except
// `settings` (Python `dict[str, Any]`) is carried as a JSON-encoded
// string -- see this file's header comment.
// ---------------------------------------------------------------------------

message CameraConfig {
  string name = 1;
  optional string playfield = 2;
  // JSON object text, e.g. "{}" for no settings. Stored and echoed
  // back verbatim; never applied to hardware this sprint.
  string settings_json = 3;
}

message SetCameraConfigRequest {
  CameraConfig config = 1;
}

message SetCameraConfigResponse {}

message GetCameraConfigRequest {
  string camera = 1;
}

message GetCameraConfigResponse {
  CameraConfig config = 1;
}

// ---------------------------------------------------------------------------
// Calibration (ticket 022-003). Mirrors aprilcam.calibration.interfaces.
// CalibrationResult / aprilcam.calibration.calibration.Calibration
// field for field -- see this file's header comment.
// ---------------------------------------------------------------------------

message CalibrationResult {
  bool succeeded = 1;
  // ArUco ids matched to surveyed positions. Sorted ascending.
  repeated int32 matched_ids = 2;
  // Ids the playfield definition requires that were not detected --
  // the exact ids, never a count (UC-04.S-2). Non-empty means failure.
  repeated int32 missing_ids = 3;
  optional double reprojection_error_cm = 4;
  // Why a *complete-but-degenerate* solve failed (collinear markers,
  // singular homography) -- absent when `missing_ids` alone explains
  // the failure, or on success.
  optional string reason = 5;
}

// A camera's established pixel<->world mapping. Mirrors
// aprilcam.calibration.calibration.Calibration field for field.
// `homography` is the solved pixel->world 3x3 matrix, row-major
// (h[0..2] = row 0, h[3..5] = row 1, h[6..8] = row 2) -- exactly 9
// values, always, since a 2D homography is fixed-shape and a nested
// matrix message type would be unused generality.
message Calibration {
  bool stale = 1;
  double calibrated_at = 2;
  string playfield = 3;
  repeated double homography = 4;
  repeated int32 matched_ids = 5;
  optional double reprojection_error_cm = 6;
}

message CalibrateRequest {
  string camera = 1;
}

message CalibrateResponse {
  CalibrationResult result = 1;
}

message GetCalibrationRequest {
  string camera = 1;
}

message GetCalibrationResponse {
  // Absent (`HasField("calibration") == false`) means this camera has
  // never been successfully calibrated -- never a fabricated/default
  // Calibration (see the RPC's own comment above).
  Calibration calibration = 1;
}
